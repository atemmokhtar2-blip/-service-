<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>مصنع البوتات</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090b;color:#f4f4f5;font:16px system-ui,sans-serif}.card{width:min(92vw,560px);padding:32px;border:1px solid #27272a;border-radius:22px;background:#111113;box-shadow:0 20px 70px #0008}h1{margin:0 0 12px;font-size:28px}p{color:#a1a1aa;line-height:1.8}.status{display:inline-flex;gap:8px;align-items:center;color:#d4d4d8;background:#27272a;padding:8px 12px;border-radius:999px;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#a1a1aa}
  </style>
</head>
<body><main class="card"><span class="status"><i class="dot"></i> واجهة الخدمة</span><h1>مصنع البوتات</h1><p>هذه واجهة الخدمة الخلفية. التفاعل مع المصنع يتم من خلال بوت تيليجرام الرسمي، وليس من هذه الصفحة.</p></main></body>
</html>
